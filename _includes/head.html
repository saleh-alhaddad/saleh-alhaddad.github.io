<!-- Site Head: Meta tags, fonts, and external resources -->
<head>
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Title and Description -->
  <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | default: site.data.author.name | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | default: site.data.author.summary | escape }}">
  
  <!-- SEO and Open Graph Meta Tags -->
  <meta property="og:title" content="{{ page.og_title | default: site.og_title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | default: site.data.author.summary | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.og_title | default: site.og_title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
  <meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  
  <!-- Favicon and Icons -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  
  <!-- External Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,500;0,700;0,800;1,700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  
  <!-- Structured Data for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.data.author.name | escape }}",
    "jobTitle": "{{ site.data.author.current_role.position | escape }}",
    "description": "{{ site.data.author.bio | escape }}",
    "url": "{{ site.url | escape }}",
    "image": "{{ site.data.author.avatar | absolute_url }}",
    "email": "{{ site.data.author.email | escape }}",
    "sameAs": [
      "{{ site.data.social.github.url | escape }}",
      "{{ site.data.social.linkedin.url | escape }}",
      "{{ site.data.social.medium.url | escape }}"
    ],
    "worksFor": {
      "@type": "Organization",
      "name": "{{ site.data.author.current_role.company | escape }}",
      "url": "{{ site.data.author.current_role.company_url | escape }}"
    }
  }
  </script>

  <!-- Analytics: GoatCounter. Cookieless and privacy-friendly, so no consent
       banner is required. count.js skips localhost and private networks on its
       own, and auto-counts on window load, so it must stay a static tag. -->
  <script data-goatcounter="https://salehalhaddad.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
